name: Main
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 🛠️ Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers
      - name: 📎 Clippy
        env:
          SKIP_GLTF_EXPORT: true
        run: cargo clippy -- -D warnings
      - name: 🧹 RustFmt
        env:
          SKIP_GLTF_EXPORT: true
        run: cargo fmt --all -- --check
  test:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v7
      - name: 🛠️ Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers
      - name: 🧪 Test
        env:
          SKIP_GLTF_EXPORT: true
        run: cargo test --no-fail-fast
