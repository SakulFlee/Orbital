name: Main
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: 📎 Clippy
        env:
          SKIP_GLTF_EXPORT: true
        run: nix develop --extra-experimental-features 'nix-command flakes' --command cargo clippy
      - name: 🧹 RustFmt
        env:
          SKIP_GLTF_EXPORT: true
        run: nix develop --extra-experimental-features 'nix-command flakes' --command cargo fmt --all --check
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧪 Test
        env:
          SKIP_GLTF_EXPORT: true
        run: nix develop --extra-experimental-features 'nix-command flakes' --command cargo test --no-fail-fast
  build-linux:
    runs-on: ${{ matrix.runs-on }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔨 Build
        env:
          SKIP_GLTF_EXPORT: true
        run: nix develop --extra-experimental-features 'nix-command flakes' --command cargo build --release --target ${{ matrix.target }}
      - name: ➕ Make upload folder
        run: mkdir upload
      - name: 🔎 Find files to upload
        run: |
          find target/${{ matrix.target }}/release -mindepth 1 -maxdepth 1 -type f -not -name '*.d' -not -name '*.rlib' -not -name '.cargo-lock' -not -name 'CACHEDIR.TAG' -exec mv {} upload/ \;
          mv Assets/ upload/
      - name: 📦 Make archive
        working-directory: upload
        run: zip -r ../${{ matrix.target }}.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.zip
          if-no-files-found: 'error'
  build-macos:
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 💾 Cache
        uses: actions/cache@v6.1.0
        with:
          path: target/
          key: target-${{ matrix.target }}
      - name: 🦀 Rust setup
        run: |
          rustup default stable
          rustup update
          rustup target add ${{ matrix.target }}
      - name: 🛠️ Install Blender
        run: brew install blender
      - name: 🔨 Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: ➕ Package
        run: |
          mkdir upload
          find target/${{ matrix.target }}/release -mindepth 1 -maxdepth 1 -type f -not -name '*.d' -not -name '*.rlib' -not -name '.cargo-lock' -not -name 'CACHEDIR.TAG' -exec mv {} upload/ \;
          mv Assets/ upload/
          cd upload && zip -r ../${{ matrix.target }}.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.zip
          if-no-files-found: 'error'
  build-windows:
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            os: windows-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 💾 Cache
        uses: actions/cache@v6.1.0
        with:
          path: target/
          key: target-${{ matrix.target }}
      - name: 🦀 Rust setup
        run: |
          rustup default stable
          rustup update
          rustup target add ${{ matrix.target }}
      - name: 🛠️ Install Blender
        shell: pwsh
        run: choco install blender --no-progress
      - name: ➕ Add Blender to PATH
        shell: pwsh
        run: |
          $blenderBaseDir = "C:\Program Files\Blender Foundation"
          Write-Host "Searching for Blender installation in: $blenderBaseDir"
          $blenderInstallDir = Get-ChildItem -Path $blenderBaseDir -Directory | Sort-Object CreationTime -Descending | Select-Object -First 1
          if ($blenderInstallDir) {
            $blenderPath = $blenderInstallDir.FullName
            Write-Host "Discovered Blender installation at: $blenderPath"
            $blenderExeFullPath = Join-Path $blenderPath "blender.exe"
            if (Test-Path $blenderExeFullPath) {
              Write-Host "Confirmed blender.exe exists at: $blenderExeFullPath"
              echo "$blenderPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Blender added to PATH: $blenderPath"
            } else {
              Write-Host "ERROR: blender.exe not found at expected path: $blenderExeFullPath"
              Exit 1
            }
          } else {
            Write-Host "ERROR: No Blender installation directory found under $blenderBaseDir."
            Exit 1
          }
      - name: 🔨 Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: ➕ Package
        shell: pwsh
        run: |
          mkdir upload
          Get-ChildItem -Path "target/${{ matrix.target }}/release" -Depth 0 -File -Exclude "*.d", "*.rlib", ".cargo-lock", "CACHEDIR.TAG" | Move-Item -Destination "upload/" -Force
          Move-Item -Force -Path "Assets/" -Destination "upload/"
          Compress-Archive -Destination ../${{ matrix.target }}.zip -Path .\upload\*
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.zip
          if-no-files-found: 'error'
  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
      - build-windows
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
      - name: ➕ Make upload folder
        run: mkdir upload
      - name: 🔄 Move files to upload folder
        run: find . -type f -name '*.zip' -exec mv {} upload/ \;
      - name: 👀 Show files to be uploaded
        run: ls -al upload/
      - uses: softprops/action-gh-release@v3
        with:
          files: upload/*
          draft: false
          generate_release_notes: true
