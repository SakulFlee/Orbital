name: PR
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    env:
      SKIP_GLTF_EXPORT: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          submodules: true
      - name: Cache sccache
        uses: https://code.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: /root/.cache/sccache
          key: sccache-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-test-
      - name: Test
        run: cargo test --no-fail-fast
      - name: sccache stats
        run: sccache --show-stats
  build:
    runs-on: ubuntu-latest
    needs: test
    container:
      image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    env:
      SKIP_GLTF_EXPORT: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
      SCCACHE_CACHE_SIZE: 10G
      PKG_CONFIG_ALLOW_CROSS: 1
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          submodules: true
      - name: Cache cargo registry
        uses: https://code.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-
      - name: Cache sccache
        uses: https://code.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: /root/.cache/sccache
          key: sccache-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ matrix.target }}-
      - name: Build
        run: |
          [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          cargo build --release --target ${{ matrix.target }}
      - name: sccache stats
        run: sccache --show-stats
