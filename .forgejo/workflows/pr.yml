name: PR
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    env:
      SKIP_GLTF_EXPORT: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
      SCCACHE_CACHE_SIZE: 10G
      FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Cache cargo registry
        id: cargo-cache
        uses: https://code.forgejo.org/actions/cache@v6
        continue-on-error: true
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-
      - name: Cache sccache
        id: sccache-cache
        uses: https://code.forgejo.org/actions/cache@v6
        continue-on-error: true
        with:
          path: /root/.cache/sccache
          key: sccache-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-test-
      - name: Install cargo-nextest
        run: |
          if ! command -v cargo-nextest >/dev/null 2>&1; then
            curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          fi
      - name: Smart test
        run: node .forgejo/ci/smart-test.mjs
      - name: Save cargo registry after failed run
        if: failure() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Save sccache after failed run
        if: failure() && steps.sccache-cache.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/actions/cache/save@v6
        continue-on-error: true
        with:
          path: /root/.cache/sccache
          key: sccache-test-${{ hashFiles('**/Cargo.lock') }}
      - name: sccache stats
        if: always()
        run: sccache --show-stats
