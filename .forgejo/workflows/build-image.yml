name: Build CI Image
on:
  push:
    branches: [main, ci-caching]
    paths:
      - '.forgejo/ci/**'
      - '.forgejo/workflows/build-image.yml'
      - 'rust-toolchain.toml'
      - 'Containerfile'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Force rebuild and push the CI image
        type: boolean
        default: true
  schedule:
    - cron: '0 4 1 * *'
jobs:
  build-and-push:
    runs-on: docker
    env:
      FORGEJO_REGISTRY: forgejo.sakul-flee.de
      OCI_PUSH_TOKEN: ${{ secrets.OCI_PUSH_TOKEN }}
      IMAGE: orbital-ci-build-image
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Build image
        run: |
          docker build --pull \
            --tag "$FORGEJO_REGISTRY/sakulflee/$IMAGE:latest" \
            --file .forgejo/ci/Dockerfile .
      - name: Push image
        run: |
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$OCI_PUSH_TOKEN" | docker login --username sakulflee --password-stdin "$FORGEJO_REGISTRY"
          docker push "$FORGEJO_REGISTRY/sakulflee/$IMAGE:latest"
