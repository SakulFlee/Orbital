name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    env:
      SKIP_GLTF_EXPORT: "true"
      PKG_CONFIG_ALLOW_CROSS: 1
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - name: Install system dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends pkg-config gcc build-essential libudev-dev libwayland-dev libxkbcommon-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 libc6-dev:arm64 libudev-dev:arm64 libwayland-dev:arm64 libxkbcommon-dev:arm64 libvulkan-dev:arm64 zip git curl ca-certificates rsync
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$FORGEJO_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add ${{ matrix.target }}
      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir upload
          find "target/${{ matrix.target }}/release" -mindepth 1 -maxdepth 1 -type f -not -name '*.d' -not -name '*.rlib' -not -name '.cargo-lock' -not -name 'CACHEDIR.TAG' -not -name '*.pdb' -exec mv {} upload/ \;
          mv Assets/ upload/
          cd upload && zip -r "../${{ matrix.target }}.zip" .
      - name: Publish
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: upload