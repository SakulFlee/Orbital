name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: forgejo-http.forgejo.svc.cluster.local:3000/sakulflee/orbital-ci-build-image:latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-gnu]
    env:
      SKIP_GLTF_EXPORT: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
      SCCACHE_CACHE_SIZE: 10G
      PKG_CONFIG_ALLOW_CROSS: 1
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - name: Cache sccache
        uses: https://code.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: /root/.cache/sccache
          key: sccache-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ matrix.target }}-
      - name: Build
        run: |
          [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir upload
          find "target/${{ matrix.target }}/release" -mindepth 1 -maxdepth 1 -type f -not -name '*.d' -not -name '*.rlib' -not -name '.cargo-lock' -not -name 'CACHEDIR.TAG' -not -name '*.pdb' -exec mv {} upload/ \;
          mv Assets/ upload/
          cd upload && zip -r "../${{ matrix.target }}.zip" .
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: ${{ matrix.target }}.zip
      - name: sccache stats
        run: sccache --show-stats
  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - name: Download artifacts
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -name '*.zip' -exec mv {} release/ \;
      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          override: true
          release-dir: release
          sha256sum: true
          token: ${{ forgejo.token }}
