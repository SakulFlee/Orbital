name: Templates
on:
  pull_request:
    paths:
      - 'Examples/**'
      - 'Crates/orbital_cli/**'
      - 'Assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.forgejo/ci/test-templates.sh'
      - '.forgejo/workflows/templates.yml'
  workflow_dispatch:
jobs:
  templates:
    runs-on: ubuntu-latest
    container:
      image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    env:
      SKIP_GLTF_EXPORT: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: 0
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Cache cargo registry
        uses: https://code.forgejo.org/actions/cache@v6
        continue-on-error: true
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-templates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-templates-
      - name: Cache sccache
        uses: https://code.forgejo.org/actions/cache@v6
        continue-on-error: true
        with:
          path: /root/.cache/sccache
          key: sccache-templates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-templates-
      - name: Check template generation
        run: bash .forgejo/ci/test-templates.sh
      - name: sccache stats
        if: always()
        run: sccache --show-stats
