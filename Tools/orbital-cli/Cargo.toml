[package]
name = "orbital-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "orbital"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
inquire = "0.7"
dirs = "6.0"
ureq = "3.0"
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
indicatif = "0.18"
