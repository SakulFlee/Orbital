[workspace]
resolver = "2"
members = ["Examples/*", "Crates/*"]

[workspace.package]
version = "0.15.0-dev"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/iced-rs/iced"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]
rust-version = "1.93"

[workspace.dependencies]
# Orbital crates
wgpu = { version = "30.0.0", features = [
  "angle",
  "dx12",
  "glsl",
  "metal",
  "naga-ir",
  "serde",
  "spirv",
  "webgl",
  "webgpu",
  "wgsl",
] }
cgmath = "0.18.0"
dirs = "6.0.0"
gltf = { version = "1.4.1", features = ["KHR_lights_punctual"] }
fern = "0.7.0"
hashbrown = "0.17.0"
humantime = "2.1.0"
fontdue = "0.9.0"
rand = "0.10.0"
ulid = "1.0"
glob = "0.3.1"
gilrs = "0.11.0"
android_logger = "0.15.0"
objc2 = "0.6"
objc2-foundation = "0.3"
pollster = "1.0"
rayon = "1.10"
wasm-bindgen-rayon = "1.2"
criterion = { version = "0.8", features = ["html_reports"] }

# Iced sub-crates (wgpu 30 fork)
iced = { version = "0.15.0-dev", path = "Crates/orbital-iced", default-features = false }
iced_beacon = { version = "0.15.0-dev", path = "Crates/orbital-iced/beacon" }
iced_core = { version = "0.15.0-dev", path = "Crates/orbital-iced/core" }
iced_debug = { version = "0.15.0-dev", path = "Crates/orbital-iced/debug" }
iced_devtools = { version = "0.15.0-dev", path = "Crates/orbital-iced/devtools" }
iced_futures = { version = "0.15.0-dev", path = "Crates/orbital-iced/futures" }
iced_graphics = { version = "0.15.0-dev", path = "Crates/orbital-iced/graphics" }
iced_highlighter = { version = "0.15.0-dev", path = "Crates/orbital-iced/highlighter" }
iced_program = { version = "0.15.0-dev", path = "Crates/orbital-iced/program" }
iced_renderer = { version = "0.15.0-dev", path = "Crates/orbital-iced/renderer" }
iced_runtime = { version = "0.15.0-dev", path = "Crates/orbital-iced/runtime" }
iced_selector = { version = "0.15.0-dev", path = "Crates/orbital-iced/selector" }
iced_test = { version = "0.15.0-dev", path = "Crates/orbital-iced/test" }
iced_tester = { version = "0.15.0-dev", path = "Crates/orbital-iced/tester" }
iced_tiny_skia = { version = "0.15.0-dev", path = "Crates/orbital-iced/tiny_skia", default-features = false }
iced_wgpu = { version = "0.15.0-dev", path = "Crates/orbital-iced/wgpu", default-features = false }
iced_widget = { version = "0.15.0-dev", path = "Crates/orbital-iced/widget" }
iced_winit = { version = "0.15.0-dev", path = "Crates/orbital-iced/winit", default-features = false }

# Iced third-party deps
arboard = { version = "3.6", default-features = false }
bincode = "1.3"
bitflags = "2.0"
bytemuck = { version = "1.0", features = ["derive"] }
bytes = "1.6"
cargo-hot = { version = "0.1", package = "cargo-hot-protocol" }
cosmic-text = { git = "https://github.com/hecrj/cosmic-text.git", rev = "6e10ac2ce889f48c9eeb1f19c1340a37d6afae31" }
cryoglyph = { git = "https://github.com/sertonix/cryoglyph.git", branch = "wgpu-30" }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "async-await",
] }
glam = "0.33.2"
guillotiere = "0.6"
half = "2.2"
image = "0.25.0"
kamadak-exif = "0.6"
kurbo = "0.10"
lilt = "0.8"
log = "0.4.21"
lyon = "1.0"
lyon_path = "1.0"
mundy = { version = "0.2", default-features = false }
nom = "8"
num-traits = "0.2"
png = "0.18"
pulldown-cmark = "0.12"
qrcode = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
resvg = { version = "0.45", default-features = false }
rfd = "0.16"
rustc-hash = "2.0"
semver = "1.0"
serde = { version = "1.0.174", features = ["derive"] }
sha2 = "0.10"
sipper = "0.2"
smol = "2"
smol_str = "0.2"
softbuffer = { version = "0.4", default-features = false }
sysinfo = "0.33"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = [
  "std",
  "simd",
] }
tokio = "1.0"
tracing = "0.1"
two-face = { version = "0.5", default-features = false, features = [
  "syntect-fancy",
] }
unicode-segmentation = "1.0"
url = "2.5"
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4.2"
web-sys = "0.3"
web-time = "1.1"
winit = { git = "https://forgejo.sakul-flee.de/SakulFlee/Orbital-Winit.git", rev = "13ed4eaa580bd91b5030fe8beef655d482f74a6d", default-features = false, features = [
  "rwh_06",
] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[profile.dev]
opt-level = 1
lto = "thin"
codegen-units = 16

[profile.dev.package.wgpu]
opt-level = 3

[profile.dev.package.winit]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.cgmath]
opt-level = 3

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"
unused_results = "deny"

[workspace.lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
manual_filter = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
default_trait_access = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
new_without_default = "deny"
useless_conversion = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"

[patch.crates-io]
cosmic-text = { git = "https://github.com/hecrj/cosmic-text.git", rev = "6e10ac2ce889f48c9eeb1f19c1340a37d6afae31" }
