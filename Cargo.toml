[workspace]
resolver = "2"
members = ["Examples/*", "Crates/*"]

[workspace.package]
version = "0.15.0-dev"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/iced-rs/iced"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]
rust-version = "1.94"

[workspace.dependencies]
# Orbital crates
wgpu = { version = "30.0.0", features = [
  "angle",
  "dx12",
  "glsl",
  "metal",
  "naga-ir",
  "serde",
  "spirv",
  "webgl",
  "webgpu",
  "wgsl",
] }
cgmath = "0.18.0"
dirs = "7.0.0"
gltf = { version = "1.4.1", features = ["KHR_lights_punctual"] }
fern = "0.7.0"
hashbrown = "0.17.0"
humantime = "2.1.0"
fontdue = "0.9.0"
rand = "0.10.0"
ulid = "3.0"
glob = "0.3.1"
gilrs = "0.11.0"
android_logger = "0.15.0"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-game-controller = "0.3"
pollster = "1.0"
rayon = "1.10"
wasm-bindgen-rayon = "1.2"

# Procedural macros (orbital_macros)
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

criterion = { version = "0.8", features = ["html_reports"] }

# Iced sub-crates (wgpu 30 fork)
iced_core = { git = "https://forgejo.sakul-flee.de/SakulFlee/orbital-iced.git", branch = "master" }
iced_widget = { git = "https://forgejo.sakul-flee.de/SakulFlee/orbital-iced.git", branch = "master" }
iced_runtime = { git = "https://forgejo.sakul-flee.de/SakulFlee/orbital-iced.git", branch = "master" }
iced_graphics = { git = "https://forgejo.sakul-flee.de/SakulFlee/orbital-iced.git", branch = "master" }
iced_wgpu = { git = "https://forgejo.sakul-flee.de/SakulFlee/orbital-iced.git", branch = "master", default-features = false }
iced_winit = { git = "https://forgejo.sakul-flee.de/SakulFlee/orbital-iced.git", branch = "master", default-features = false }

# Iced third-party deps
arboard = { version = "3.6", default-features = false }
bitflags = "2.0"
bytemuck = { version = "1.0", features = ["derive"] }
bytes = "1.6"
cargo-hot = { version = "0.1", package = "cargo-hot-protocol" }
cosmic-text = { git = "https://github.com/hecrj/cosmic-text.git", rev = "19cca2bd90e73e20614964f06d44240e71e503b3" }
cryoglyph = { git = "https://github.com/sertonix/cryoglyph.git", rev = "6b341f2ea339abaf86b8add2cff317e7d8607ce9" }
futures = { version = "0.3", default-features = false, features = [
  "std",
  "async-await",
] }
glam = "0.34.0"
guillotiere = "0.7"
half = "2.2"
image = "0.25.0"
kamadak-exif = "0.6"
kurbo = "0.13"
lilt = "0.8"
log = "0.4.21"
lyon = "1.0"
lyon_path = "1.0"
mundy = { version = "0.2", default-features = false }
nom = "8"
num-traits = "0.2"
png = "0.18"
pulldown-cmark = "0.13"
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"
resvg = { version = "0.48", default-features = false }
rfd = "0.17"
rustc-hash = "2.0"
semver = "1.0"
serde = { version = "1.0.174", features = ["derive"] }
serde-wincode = "0.1"
sha2 = "0.11"
sipper = "0.2"
smol = "2"
smol_str = "0.2"
softbuffer = { version = "0.4", default-features = false }
sysinfo = "0.39"
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = [
  "std",
  "simd",
] }
tokio = "1.0"
tracing = "0.1"
two-face = { version = "0.5", default-features = false, features = [
  "syntect-fancy",
] }
unicode-segmentation = "1.0"
url = "2.5"
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4.2"
wincode = "0.6"
web-sys = "0.3"
web-time = "1.1"
winit = { git = "https://forgejo.sakul-flee.de/SakulFlee/Orbital-Winit.git", branch = "main", default-features = false, features = [
  "rwh_06",
] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[profile.dev]
opt-level = 1
lto = "thin"
codegen-units = 16

[profile.dev.package.wgpu]
opt-level = 3

[profile.dev.package.winit]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.cgmath]
opt-level = 3

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"
unused_results = "deny"

[workspace.lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
manual_filter = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
default_trait_access = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
new_without_default = "deny"
useless_conversion = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"

[patch.crates-io]
cosmic-text = { git = "https://github.com/hecrj/cosmic-text.git", rev = "19cca2bd90e73e20614964f06d44240e71e503b3" }
