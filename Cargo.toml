[workspace]
resolver = "2"
members = ["Runtime", "Examples/*", "Crates/*"]

[workspace.dependencies]
log = "0.4"
simple-log = "2.4"
wasmtime = "41.0"
wasmtime-wasi = "41.0"
wit-bindgen = "0.53"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package.wgpu]
opt-level = 3

[profile.dev.package.winit]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.pollster]
opt-level = 3

[profile.dev.package.async-std]
opt-level = 3

[profile.dev.package.cgmath]
opt-level = 3
