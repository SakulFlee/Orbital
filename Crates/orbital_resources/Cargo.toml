[package]
name = "orbital_resources"
version = "0.1.0"
edition = "2024"

[dependencies]
orbital_core = { path = "../orbital_core" }
orbital_shader_preprocessor = { path = "../orbital_shader_preprocessor" }
wgpu = { workspace = true }
cgmath = { workspace = true }
image = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
ulid = { workspace = true }
hashbrown = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
# Matches the naga version used by wgpu 30 — validates WGSL shaders in tests.
naga = { version = "30.0.0", default-features = false, features = ["wgsl-in"] }
