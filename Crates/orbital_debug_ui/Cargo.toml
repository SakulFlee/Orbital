[package]
name = "orbital_debug_ui"
version = "0.1.0"
edition = "2024"
description = "Debug overlay UI for the Orbital game engine (performance, ECS inspector, console)"
license = "MIT"

[dependencies]
cgmath = { workspace = true }
log = { workspace = true }
winit = { workspace = true }

orbital_app = { path = "../orbital_app" }
orbital_core = { path = "../orbital_core" }
orbital_ecs = { path = "../ecs" }
orbital_ecs_bridge = { path = "../orbital_ecs_bridge" }
orbital_iced = { path = "../orbital_iced" }

# Iced sub-crates, matching orbital_iced so the types line up.
iced_core = { workspace = true }
iced_widget = { workspace = true, features = ["wgpu"] }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true }
