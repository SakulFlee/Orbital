[package]
name = "orbital_iced"
version = "0.1.0"
edition = "2024"
description = "Iced UI integration for the Orbital game engine"
license = "MIT"

[dependencies]
orbital_app = { path = "../orbital_app" }
orbital_ecs = { path = "../ecs" }
orbital_ecs_bridge = { path = "../orbital_ecs_bridge" }
log = { workspace = true }

# iced sub-crates
iced_core = { workspace = true }
iced_widget = { workspace = true }
iced_runtime = { workspace = true }
iced_graphics = { workspace = true, features = ["fira-sans"] }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true, features = ["x11", "wayland"] }

wgpu = { workspace = true }
winit = { workspace = true }
raw-window-handle = { workspace = true }
