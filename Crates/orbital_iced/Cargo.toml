[package]
name = "orbital_iced"
version = "0.1.0"
edition = "2024"
description = "Iced UI integration for the Orbital game engine"
license = "MIT"

[dependencies]
orbital_app = { path = "../orbital_app" }
orbital_ecs = { path = "../ecs" }
orbital_ecs_bridge = { path = "../orbital_ecs_bridge" }
log = "0.4"

# iced sub-crates
iced_core = { path = "../orbital-iced/core", default-features = false }
iced_widget = { path = "../orbital-iced/widget", default-features = false }
iced_runtime = { path = "../orbital-iced/runtime", default-features = false }
iced_graphics = { path = "../orbital-iced/graphics", default-features = false, features = ["fira-sans"] }
iced_wgpu = { path = "../orbital-iced/wgpu", default-features = false }
iced_winit = { path = "../orbital-iced/winit", default-features = false, features = ["x11", "wayland"] }

wgpu = { version = "30.0.0", features = ["wgsl"] }
winit = "0.30.0"
raw-window-handle = "0.6"
