[package]
name = "orbital_iced"
version.workspace = true
authors.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Iced UI integration for the Orbital game engine"

[dependencies]
orbital_app = { path = "../orbital_app" }
orbital_ecs = { path = "../ecs" }
orbital_ecs_bridge = { path = "../orbital_ecs_bridge" }
log = { workspace = true }

# iced sub-crates
iced_core = { workspace = true }
iced_widget = { workspace = true, features = ["wgpu", "canvas"] }
iced_runtime = { workspace = true }
iced_graphics = { workspace = true, features = ["fira-sans"] }
iced_wgpu = { workspace = true }
iced_winit = { workspace = true }

wgpu = { workspace = true }
winit = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# X11/Wayland backends are Linux-only. In particular the `wayland` feature
# enables `arboard/wayland-data-control`, and `arboard` itself is not a
# dependency on Android (see the orbital-iced fork's winit crate), so these
# must not be enabled unconditionally.
iced_winit = { workspace = true, features = ["x11", "wayland"] }
