[package]
name = "orbital_app"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Semantic gamepad input; always available through orbital_input's
# default features. Kept as a no-op for downstream compatibility.
gamepad_input = []
# gilrs polling backend for desktop gamepads (mobile relies on the
# platform's own providers instead).
gamepad_gilrs = [
    "dep:gilrs",
    "orbital_input/gamepad_input",
    "orbital_input/gamepad_gilrs",
]
auto_request_redraw = []
# Poll gamepads every frame (implies the gilrs backend).
gamepad_input_poll = ["gamepad_gilrs"]
default = []

[dependencies]
orbital_core = { path = "../orbital_core" }
orbital_camera = { path = "../orbital_camera" }
orbital_cull = { path = "../orbital_cull" }
orbital_ecs = { path = "../ecs" }
orbital_ecs_bridge = { path = "../orbital_ecs_bridge" }
orbital_ibl_brdf = { path = "../orbital_ibl_brdf" }
orbital_input = { path = "../orbital_input" }
orbital_instance = { path = "../orbital_instance" }
orbital_light = { path = "../orbital_light" }
orbital_material_shader = { path = "../orbital_material_shader" }
orbital_model = { path = "../orbital_model" }
orbital_renderer = { path = "../orbital_renderer" }
orbital_shader_core = { path = "../orbital_shader_core" }
orbital_shader_engine = { path = "../orbital_shader_engine" }
orbital_shader_math = { path = "../orbital_shader_math" }
orbital_shader_preprocessor = { path = "../orbital_shader_preprocessor" }
orbital_shader_pbr = { path = "../orbital_shader_pbr" }
orbital_shadow = { path = "../orbital_shadow" }
orbital_texture = { path = "../orbital_texture" }
orbital_world_environment = { path = "../orbital_world_environment" }
cgmath = { workspace = true }
libc = "0.2"
libloading = "0.9"
log = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

gilrs = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }
jni = "0.22"
winit = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-game-controller = { workspace = true }
