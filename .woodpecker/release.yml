depends_on: [linting, test]

when:
  - event: tag
    ref: refs/tags/v*

matrix:
  TARGET:
    - x86_64-unknown-linux-gnu
    - aarch64-unknown-linux-gnu
    - x86_64-pc-windows-gnu

steps:
  restore_cache:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - mkdir -p "/cache/orbital/release-$TARGET" /cache/orbital/cargo
      - rsync -a "/cache/orbital/release-$TARGET/" target/ || true
      - rsync -a /cache/orbital/cargo/ /usr/local/cargo/ || true

  build:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    environment:
      SKIP_GLTF_EXPORT: "true"
    commands:
      - |
        [ "$TARGET" = "aarch64-unknown-linux-gnu" ] && export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
        cargo build --release --target "$TARGET"

  package:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    commands:
      - mkdir upload
      - find "target/$TARGET/release" -mindepth 1 -maxdepth 1 -type f -not -name '*.d' -not -name '*.rlib' -not -name '.cargo-lock' -not -name 'CACHEDIR.TAG' -not -name '*.pdb' -exec mv {} upload/ \;
      - mv Assets/ upload/
      - cd upload && zip -r "../$TARGET.zip" .

  publish:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - |
        REPO_URL=$(git remote get-url origin)
        BASE_URL=$(echo "$REPO_URL" | cut -d/ -f1-3)
        API_URL="$BASE_URL/api/v1/repos/$CI_REPO_OWNER/$CI_REPO_NAME"
        RESP=$(curl -s -u "$FORGEJO_USER:$FORGEJO_TOKEN" "$API_URL/releases/tags/$CI_TAG")
        RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        if [ -z "$RELEASE_ID" ]; then
          RESP=$(curl -s -X POST \
            -u "$FORGEJO_USER:$FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$CI_TAG\", \"name\": \"$CI_TAG\", \"body\": \"Release $CI_TAG\", \"draft\": false, \"prerelease\": false}" \
            "$API_URL/releases")
          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
        fi
        if [ -n "$RELEASE_ID" ]; then
          curl -s -X POST \
            -u "$FORGEJO_USER:$FORGEJO_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$TARGET.zip" \
            "$API_URL/releases/$RELEASE_ID/assets?name=$TARGET.zip"
          echo "Published $TARGET.zip to release $CI_TAG"
        else
          echo "Failed to get or create release"
          exit 1
        fi

  save_cache:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - rsync -a --delete target/ "/cache/orbital/release-$TARGET/"
      - rsync -a /usr/local/cargo/registry/ /cache/orbital/cargo/registry/
      - rsync -a /usr/local/cargo/git/ /cache/orbital/cargo/git/
