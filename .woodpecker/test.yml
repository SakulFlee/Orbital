depends_on: [linting]

when:
  - event: manual
  - event: pull_request

steps:
  restore_cache:
    image: alpine:latest
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - apk add --no-cache rsync
      - rsync -a /cache/target.0/ target/ || true

  test:
    image: nixos/nix:latest
    environment:
      SKIP_GLTF_EXPORT: "true"
    commands:
      - nix develop --extra-experimental-features 'nix-command flakes' --command cargo test --no-fail-fast

  save_cache:
    image: alpine:latest
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - apk add --no-cache rsync
      - rm -rf /cache/target.1
      - mv /cache/target.0 /cache/target.1 || true
      - if [ -d /cache/target.1 ]; then
          rsync -a --delete --link-dest=../target.1 target/ /cache/target.0/
        else
          rsync -a --delete target/ /cache/target.0/
        fi
