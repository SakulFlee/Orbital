depends_on: [linting]

when:
  - event: manual
  - event: pull_request

steps:
  restore_cache:
    image: alpine:latest
    volumes:
      - /var/lib/woodpecker/cache/orbital-target:/cache:rw
    commands:
      - apk add --no-cache rsync
      - rsync -a /cache/ target/ || true

  test:
    image: nixos/nix:latest
    environment:
      SKIP_GLTF_EXPORT: "true"
    commands:
      - nix develop --extra-experimental-features 'nix-command flakes' --command cargo test --no-fail-fast

  save_cache:
    image: alpine:latest
    volumes:
      - /var/lib/woodpecker/cache/orbital-target:/cache:rw
    commands:
      - apk add --no-cache rsync
      - rsync -a --delete target/ /cache/
