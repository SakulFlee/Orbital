depends_on: [linting]

when:
  - event: manual
  - event: pull_request

steps:
  restore_cache:
    image: alpine:latest
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - apk add --no-cache rsync
      - mkdir -p /cache/orbital/target
      - rsync -a /cache/orbital/target/ target/ || true

  test:
    image: nixos/nix:latest
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    environment:
      SKIP_GLTF_EXPORT: "true"
    commands:
      - nix shell nixpkgs#rsync -c rsync -a /cache/orbital/nix/ /nix/store/ || true
      - nix develop --extra-experimental-features 'nix-command flakes' --command cargo test --no-fail-fast
      - nix shell nixpkgs#rsync -c rsync -a /nix/store/ /cache/orbital/nix/

  save_cache:
    image: alpine:latest
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - apk add --no-cache rsync
      - rsync -a --delete target/ /cache/orbital/target/
