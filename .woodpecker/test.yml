when:
  - event: [push, pull_request, manual]

steps:
  format:
    image: nixos/nix:latest
    environment:
      FORGEJO_USERNAME:
        from_secret: forgejo_username
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      SKIP_GLTF_EXPORT: "true"
    commands:
      - nix develop --extra-experimental-features 'nix-command flakes' --command cargo fmt --all
      - |
        if [ -n "$(git status --porcelain)" ]; then
          BRANCH="$CI_COMMIT_SOURCE_BRANCH"
          [ -z "$BRANCH" ] && BRANCH="$CI_COMMIT_BRANCH"
          REPO_URL=$(git remote get-url origin)
          HOST_PATH=$(echo "$REPO_URL" | cut -d/ -f3-)
          git remote set-url origin "https://$FORGEJO_USERNAME:$FORGEJO_TOKEN@$HOST_PATH"
          git config user.name "Orbital CI"
          git config user.email "ci@orbital.local"
          git add -A
          git commit -m "style: auto-format code "
          git push origin HEAD:refs/heads/$BRANCH
          echo "Format issues were fixed. Pipeline aborted - next run will use corrected code."
          exit 1
        fi

  clippy:
    image: nixos/nix:latest
    environment:
      FORGEJO_USERNAME:
        from_secret: forgejo_username
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      SKIP_GLTF_EXPORT: "true"
    commands:
      - nix develop --extra-experimental-features 'nix-command flakes' --command cargo clippy --fix --allow-dirty
      - |
        if [ -n "$(git status --porcelain)" ]; then
          BRANCH="$CI_COMMIT_SOURCE_BRANCH"
          [ -z "$BRANCH" ] && BRANCH="$CI_COMMIT_BRANCH"
          REPO_URL=$(git remote get-url origin)
          HOST_PATH=$(echo "$REPO_URL" | cut -d/ -f3-)
          git remote set-url origin "https://$FORGEJO_USERNAME:$FORGEJO_TOKEN@$HOST_PATH"
          git config user.name "Orbital CI"
          git config user.email "ci@orbital.local"
          git add -A
          git commit -m "fix: auto-fix clippy warnings "
          git push origin HEAD:refs/heads/$BRANCH
          echo "Clippy issues were fixed. Pipeline aborted - next run will use corrected code."
          exit 1
        fi

  test:
    image: nixos/nix:latest
    environment:
      SKIP_GLTF_EXPORT: "true"
    commands:
      - nix develop --extra-experimental-features 'nix-command flakes' --command cargo test --no-fail-fast
