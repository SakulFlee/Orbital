depends_on:
  - name: image
    optional: true

when:
  - event: pull_request
  - event: manual

steps:
  restore_cache:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - mkdir -p /cache/orbital/target /cache/orbital/cargo
      - rsync -a /cache/orbital/target/ target/ || true
      - rsync -a /cache/orbital/cargo/ /usr/local/cargo/ || true

  format:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      SKIP_GLTF_EXPORT: "true"
    commands:
      - cargo fmt --all
      - |
        if [ -n "$(git status --porcelain)" ]; then
          BRANCH="$CI_COMMIT_SOURCE_BRANCH"
          [ -z "$BRANCH" ] && BRANCH="$CI_COMMIT_BRANCH"
          REPO_URL=$(git remote get-url origin)
          HOST_PATH=$(echo "$REPO_URL" | cut -d/ -f3-)
          git remote set-url origin "https://$FORGEJO_USER:$FORGEJO_TOKEN@$HOST_PATH"
          git config user.name "Orbital CI"
          git config user.email "ci@orbital.local"
          git add -A
          git commit -m "style: auto-format code "
          git push origin HEAD:refs/heads/$BRANCH
          echo "Format issues were fixed. Pipeline aborted - next run will use corrected code."
          exit 1
        fi

  clippy:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    environment:
      FORGEJO_USER:
        from_secret: forgejo_user
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      SKIP_GLTF_EXPORT: "true"
    commands:
      - cargo clippy --fix --allow-dirty
      - |
        if [ -n "$(git status --porcelain)" ]; then
          BRANCH="$CI_COMMIT_SOURCE_BRANCH"
          [ -z "$BRANCH" ] && BRANCH="$CI_COMMIT_BRANCH"
          REPO_URL=$(git remote get-url origin)
          HOST_PATH=$(echo "$REPO_URL" | cut -d/ -f3-)
          git remote set-url origin "https://$FORGEJO_USER:$FORGEJO_TOKEN@$HOST_PATH"
          git config user.name "Orbital CI"
          git config user.email "ci@orbital.local"
          git add -A
          git commit -m "fix: auto-fix clippy warnings "
          git push origin HEAD:refs/heads/$BRANCH
          echo "Clippy issues were fixed. Pipeline aborted - next run will use corrected code."
          exit 1
        fi

  save_cache:
    image: forgejo.sakul-flee.de/sakulflee/orbital-ci-build-image:latest
    pull: true
    volumes:
      - /var/lib/woodpecker/cache:/cache:rw
    commands:
      - mkdir -p /cache/orbital/target
      - "[ -d target ] && rsync -a --delete target/ /cache/orbital/target/ || true"
      - mkdir -p /cache/orbital/cargo/registry
      - "[ -d /usr/local/cargo/registry ] && rsync -a /usr/local/cargo/registry/ /cache/orbital/cargo/registry/ || true"
      - mkdir -p /cache/orbital/cargo/git
      - "[ -d /usr/local/cargo/git ] && rsync -a /usr/local/cargo/git/ /cache/orbital/cargo/git/ || true"
